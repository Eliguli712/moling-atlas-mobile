name: Publish Moling atlas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'scripts/mirror_public.py'
      - 'asset-manifest.json'
      - 'index.html'
      - 'atlas-mobile.html'
      - 'source-html/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build verified atlas v14 distribution
        run: python3 scripts/mirror_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy atlas
        id: deployment
        uses: actions/deploy-pages@v5
